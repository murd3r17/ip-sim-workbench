name: CI

# Windows 保留原有检查。Linux 另外验证平台回归和本机模拟工作台。

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONUTF8: '1'

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Run tests
        env:
          JWT_SECRET_KEY: ci-only-jwt-secret-key-32chars-min!!
        run: python -m pytest tests -q

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sim-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sim-frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  hygiene:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 编码校验（.ps1 带 BOM；其它文本不带 BOM）
        run: python backend/scripts/check_encoding.py --root .
      - name: 秘密扫描（明文口令不得入库）
        run: python scripts/delivery.py scan --root .

  linux-backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install the unmodified lockfile
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Linux port and process identity regressions
        env:
          JWT_SECRET_KEY: ci-only-jwt-secret-key-32chars-min!!
        run: |
          python -m pytest -q tests/test_full_setup.py::test_full_start_refuses_occupied_port_before_any_authentication tests/test_trust/test_bf4_01_lifecycle_matrix.py::test_reconcile_detects_pid_reuse_and_missing_instance
      - name: Full backend suite
        env:
          JWT_SECRET_KEY: ci-only-jwt-secret-key-32chars-min!!
        run: python -m pytest tests -q

  linux-minimal-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sim-frontend/package-lock.json
      - name: Build frontend and install Chromium
        working-directory: sim-frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npx playwright install --with-deps chromium
      - name: Repair a partial venv and open bundled material in demo mode
        run: |
          python -m venv --without-pip backend/.venv
          python scripts/bootstrap_local.py --demo --no-start
          test ! -e .env
          backend/.venv/bin/python scripts/bootstrap_local.py --demo --start-only --port 18081 > demo-ci.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:18081/api/v1/health > /dev/null
          backend/.venv/bin/python backend/scripts/check_services.py --mode minimal --port 18081
          backend/.venv/bin/python - <<'PY'
          import httpx

          with httpx.Client(base_url="http://127.0.0.1:18081", trust_env=False, timeout=15) as client:
              session = client.post("/api/v1/auth/login", json={"username": "admin", "password": "123456"})
              session.raise_for_status()
              client.headers["Authorization"] = "Bearer " + session.json()["access_token"]
              reply = client.post("/api/v1/ai/copilot/chat", json={
                  "message": "请查教材，解释 VRRP 抢占延时，并列出处。", "context": {"route": "/knowledge"},
              })
              reply.raise_for_status()
              result = reply.json()
              assert result["generation_status"] == "retrieval_only"
              source = result["sources"][0]
              assert source["bundled"] and not source.get("page") and not source.get("edition_version")
              client.get("/api/v1/ai/knowledge/read", params={
                  "document_id": source["document_id"], "version": source["document_version"],
              }).raise_for_status()
          PY
      - name: First start and strict browser journeys
        env:
          E2E_PROFILE: minimal
          E2E_BASE_URL: http://127.0.0.1:18080
        run: |
          python scripts/bootstrap_local.py --no-start
          backend/.venv/bin/python scripts/bootstrap_local.py --start-only --port 18080 > workbench-ci.log 2>&1 &
          workbench_pid=$!
          trap 'kill "$workbench_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 "$E2E_BASE_URL/api/v1/health" > /dev/null
          E2E_ROOT_FINGERPRINT="$(python -c 'import hashlib; from pathlib import Path; print(hashlib.sha256(str(Path.cwd().resolve()).encode()).hexdigest())')"
          export E2E_ROOT_FINGERPRINT
          npm --prefix sim-frontend run test:e2e:strict -- --reporter=list,html --trace retain-on-failure --output=test-results
          npm --prefix sim-frontend run test:e2e:strict -- --grep '浏览器凭据随服务器会话退出' --repeat-each=20 --retries=0 --reporter=list --trace retain-on-failure --output=test-results/logout-repeat
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-minimal-browser
          path: |
            demo-ci.log
            workbench-ci.log
            sim-frontend/playwright-report/
            sim-frontend/test-results/
