worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }
    map $http_host $workbench_authority {
        default $host;
        "~^([a-zA-Z0-9.-]+|\[[0-9a-fA-F:]+\])(:[0-9]{1,5})?$" $http_host;
    }
    map "$scheme://$workbench_authority" $workbench_ws_source {
        default "";
        "~^http://(localhost|127\.0\.0\.1|\[::1\])(:[0-9]{1,5})?$" " ws://$workbench_authority";
        "~^https://([a-zA-Z0-9.-]+|\[[0-9a-fA-F:]+\])(:[0-9]{1,5})?$" " wss://$workbench_authority";
    }

    server {
        listen 80;
        server_name localhost;

        # 单层代理。由当前连接生成转发地址，浏览器提交的转发头不会传给后端。
        proxy_http_version 1.1;
        proxy_set_header Host $workbench_authority;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # REST API
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
        }

        # 文档开关及状态码由后端处理。
        location ~ ^/(docs|redoc)(/|$)|^/openapi\.json(/|$) {
            proxy_pass http://127.0.0.1:8000;
        }

        # 监控与助手的流式响应。
        location ~ ^/api/v1/(monitor/stream|ai/copilot/chat/stream)$ {
            proxy_pass http://127.0.0.1:8000;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            chunked_transfer_encoding on;
        }

        # WebSocket (包括 /api/v1/ws/ 路径)
        location /api/v1/ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_read_timeout 86400s;
        }

        # 前端静态资源
        location / {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'${workbench_ws_source}; font-src 'self' data:;" always;
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
