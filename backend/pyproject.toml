[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sim-backend"
version = "1.0.0"
description = "IP仿真运维管理工作台后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.23",
    "alembic>=1.14.0",
    "pymysql>=1.1.0",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.22.0",
    "cryptography>=43.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "netmiko>=4.4.0",
    "paramiko>=3.5.0",
    "httpx>=0.28.0",
    "apscheduler>=3.10.0",
    "minio>=7.2.0",
    "openpyxl>=3.1.0",
    "structlog>=24.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "websockets>=13.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "modules", "engines", "scheduler"]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.22.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "uvloop>=0.19.0; platform_system != 'Windows'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 注意：不设 asyncio_default_fixture_loop_scope。
# "session" 会破坏混用 asyncio.get_event_loop() 的 WebSocket 测试，
# "function" 与 session 级 test_engine 夹具 ScopeMismatch；
# 保持默认（function 语义 + 弃用警告噪音）为当前唯一全绿组合。
markers = [
    "asyncio: async test",
]
